<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// ============================================================
// KONFIGURASI FIREBASE
// ============================================================

const API_KEY = "AIzaSyA80QHr1pxK7AAdC44UYyx48qBJ2ML8ldA";
const DATABASE_URL = "https://monitoring-air-kebun-default-rtdb.asia-southeast1.firebasedatabase.app";

const USER_EMAIL = "alifahhabibatulqurani@gmail.com ";
const USER_PASSWORD = "Alifah22_ ";

const firebaseConfig = {
  apiKey: API_KEY,
  databaseURL: DATABASE_URL
};

// ============================================================
// KONEKSI FIREBASE
// ============================================================

let db = null;

async function connectFirebase() {
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    db = firebase.database();

    await auth.signInWithEmailAndPassword(USER_EMAIL, USER_PASSWORD);

    console.log("Login Firebase berhasil.");

    db.ref(".info/connected").on("value", snapshot => {
      const connected = snapshot.val() === true;
      document.getElementById("updateInfo").textContent =
        connected
          ? "Terhubung ke Firebase."
          : "Tidak terhubung ke Firebase.";
    });

    // Membaca data meteran
    db.ref("AgriWater/WaterMeter").on("value", snapshot => {
      if (snapshot.exists()) {
        applyMeterData(snapshot.val());
      }
    });

    // Membaca tarif PDAM
    db.ref("AgriWater/PDAM/tarifPerM3").on("value", snapshot => {
      tarifPDAM = Number(snapshot.val()) || 0;

      const input = document.getElementById("tarifPDAM");
      if (document.activeElement !== input) {
        input.value = tarifPDAM || "";
      }

      hitungBiayaPDAM();
    });

  } catch (error) {
    console.error("Firebase error:", error.code, error.message);

    document.getElementById("updateInfo").textContent =
      "Gagal terhubung ke Firebase.";

    showToast("Login atau koneksi Firebase gagal. Periksa konfigurasi.");
  }
}
</script>
